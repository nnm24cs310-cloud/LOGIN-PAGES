<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .container {
            display: flex;
            justify-content: space-between;
            height: 100vh;
            padding: 20px;
        }

        body {
            height: 100vh;
            background-color: #f2f4f7;
        }

        .logo {
            width: 70px;

            margin-bottom: 30px;
        }

        .left {
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 50px;
            position: relative;
            border-right: 1px solid #ccc;
        }

        .hero-image {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            width: 420px;
        }

        .form {
            width: 300px;
            line-height: 1.5;
            display: flex;
            justify-content: center;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            background-color: skyblue;

        }

        .hero-image img {
            width: 100%;
            height: auto;
        }

        .headline {
            font-size: 56px;
            line-height: 1.05;
            font-weight: 600;
            max-width: 420px;
            margin-top: 100px;
        }

        .right {
            width: 55%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 600px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            background-color: white;
            max-width: 90%;
        }

        .login-title {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: 600;
            color: darkgrey
        }

        .input-box {
            width: 100%;
            padding: 18px;
            margin-bottom: 18px;
            border: 1px solid dark gray;
            border-radius: 15px;
        }

        .input-box:focus {
            border-color: #1877f2;

            border: 2px solid #1877f2;
        }

        .login-button {
            background-color: #1877f2;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 30px;
        }

        .login-button:hover {
            background-color: #165cbd;
        }

        .forgot {
            width: 100%;
            margin-top: 20px;
            margin-bottom: 18px;
        }

        .forgot a {
            display: block;
            width: 100%;
            padding: 18px;
            border: 1px solid darkgray;
            border-radius: 15px;
            background-color: white;
            color: #555;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
        }

        .forgot a:hover {
            background-color: #f0f2f7;
            color: #1877f2;
        }

        .create.account-button {
            margin-top: 18px;
            margin-bottom: 20px;
            width: 100%;
            padding: 18px;
            border: 1px solid #1877f2;
            border-radius: 15px;
            background-color: white;
            color: #1877f2;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .create.account-button:hover {
            background-color: #f0f4ff;
        }

        .meta {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3px;
            margin-top: 20px;

        }

        .meta img {
            width: 30px;
            height: 30px;
        }

        .meta span {
            font-size: 20px;
            color: #555;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="left">
            <img src="facebook (1).png.png" alt="Facebook Logo" class="logo">
            <h1 class="headline">
                Explore<br>
                the<br>
                things<br>
                <span style="color: #1877f2;">you love</span><br>
            </h1>
            <div class="hero-image">
                <img src="facebook.png.png" alt="Hero Image">
            </div>
        </div>
        <div class="right">
            <div class="login-box">
                <h2 class="login-title">Log In to Facebook</h2>
                <form>
                    <input type="text" class="input-box" placeholder="Email or Phone Number">
                    <input type="password" class="input-box" placeholder="Password">
                    <button type="submit" class="login-button"
                        style="background-color: #1877f2; color: white; font-size: 15px; font-weight: 600px; cursor: pointer; border: none; width: 100%; padding: 15px; border-radius: 30px;">Log
                        In</button>
                    <div class="forgot">
                        <a href="#">Forgot Password?</a>
                    </div>
                    <button type="submit" class="create account-button">Create Account</button>
                    <div class="meta">
                        <img src="meta.png" alt="Meta Logo">
                        <span>Meta</span>
                    </div>
                </form>
            </div>
        </div>

    </div>
</body>

</html>
